<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html ide</title>

    <link rel="icon" type="image/svg+xml" href="./icons/html_ide_favico.svg">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./editor/editor.css">
  </head>
  <body>

    <toppbar>
      <div class="menus">
        <div class="menu">
          file
          <div class="actions">
            <div class="action" action="open">Open</div>
            <div class="action" action="save">Save</div>
            <div class="action" action="close">Close</div>
            <div class="action" action="save-as">Save As</div>
          </div>
        </div>
        <div class="menu">
          edit
          <div class="actions">
            <div class="action" action="edit-cut">Cut</div>
            <div class="action" action="edit-copy">Copy</div>
            <div class="action" action="edit-paste">Paste</div>
          </div>
        </div>
        <div class="menu">
          select
          <div class="actions">
            <div class="action" action="select-all">Select All</div>
            <div class="action" action="deselect">Deselect</div>
          </div>
        </div>
      </div>
    </toppbar>

    <div id="editor"></div>

    <script src="./editor/highlighting/prism.js"></script>
    <script src="./editor/editor.js"></script>

    <script src="./editor/editoraddressable.js"></script>
    <script src="./editor/eventsystem.js"></script>

    <script src="./editor/ineractiveeditor.js"></script>

    <script src="./utils/selection.js"></script>
    <script src="./utils/cutcopypast.js"></script>

    <script src="./scripts.js"></script>
  </body>
</html>
