<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html ide</title>

    <link rel="icon" type="image/svg+xml" href="./icons/html_ide_favico.svg">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./editor/editor.css">
  </head>
  <body>

    <toppbar>
      <div class="menus">
        <div class="menu">
          file
          <div class="actions">
            <div class="action" action="fopen">Open</div>
            <div class="action" action="save">Save</div>
            <div class="action" action="close">Close</div>
            <div class="action" action="save-as">Save As</div>
          </div>
        </div>
        <div class="menu">
          edit
          <div class="actions">
            <div class="action" action="cutl">cut line</div>
            <div class="action" action="past">past</div>
          </div>
        </div>
      </div>
    </toppbar>

    <div id="editor"></div>

    <script src="./editor/highlighting/prism.js"></script>
    <script src="./editor/editor.js"></script>
    <script src="./editor/ineractiveeditor.js"></script>
    <script src="./scripts.js"></script>
  </body>
</html>
